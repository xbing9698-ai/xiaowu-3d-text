<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03040b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="「小吴是笨蛋」——可触摸旋转的 3D 金属文字艺术。">
  <link rel="canonical" href="https://xbing9698-ai.github.io/xiaowu-3d-text/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="3D TYPE / 小吴是笨蛋">
  <meta property="og:title" content="小吴是笨蛋 · 3D TYPE">
  <meta property="og:description" content="可触摸旋转、双指缩放的 3D 镀铬 / 黄金文字艺术。">
  <meta property="og:url" content="https://xbing9698-ai.github.io/xiaowu-3d-text/">
  <meta property="og:image" content="https://xbing9698-ai.github.io/xiaowu-3d-text/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="小吴是笨蛋 · 3D TYPE">
  <meta name="twitter:description" content="可触摸旋转、双指缩放的 3D 镀铬 / 黄金文字艺术。">
  <meta name="twitter:image" content="https://xbing9698-ai.github.io/xiaowu-3d-text/social-preview.png">
  <title>小吴是笨蛋 · 3D TYPE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23040712'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='32' fill='%2343e7ff'%3E%E5%82%BB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="stage">
    <canvas id="scene" aria-label="可以单指旋转、双指缩放的「小吴是笨蛋」三维文字艺术"></canvas>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="edge-light" aria-hidden="true"></div>

  <div class="hud hud-top" aria-hidden="true">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>3D TYPE <b>/</b> 001</span>
    </div>
    <div class="meta">INTERACTIVE OBJECT</div>
  </div>

  <div id="hint" class="hint">单指旋转 <span>·</span> 双指缩放</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav id="dock" class="dock" aria-label="作品控制">
    <button id="pauseBtn" type="button" aria-pressed="false" aria-label="暂停动画">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M9 5.5v13M15 5.5v13"/>
      </svg>
      <span id="pauseLabel">暂停</span>
    </button>
    <button id="resetBtn" type="button" aria-label="恢复默认视角">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M4.8 8.8A8.2 8.2 0 1 1 4.5 14"/><path d="M4.5 4.8v4.4h4.4"/>
      </svg>
      <span>视角</span>
    </button>
    <button id="fxBtn" type="button" aria-label="切换特效风格">
      <span class="fx-dot" aria-hidden="true"></span>
      <span>特效</span>
    </button>
  </nav>

  <div id="loading">
    <div class="loading-inner">
      <div class="load-chars" aria-hidden="true">
        <span>小</span><span>吴</span><span>是</span><span>笨</span><span>蛋</span>
      </div>
      <div class="load-track"><i></i></div>
      <div class="load-sub">正在铸造文字</div>
    </div>
  </div>

  <div id="fatal" role="alert">
    <div class="fatal-card">
      <p class="fatal-kicker">3D TYPE / ERROR</p>
      <h2>这台设备暂时无法显示 3D 场景</h2>
      <p>请使用最新版 Microsoft Edge、Chrome 或 Safari，并确认浏览器已开启硬件加速 / WebGL。</p>
      <p id="fatalDetail" class="fatal-detail"></p>
    </div>
  </div>

  <h1 class="sr-only">小吴是笨蛋</h1>
  <noscript>
    <div class="noscript">请开启 JavaScript 以查看「小吴是笨蛋」3D 文字作品。</div>
  </noscript>

  <script src="./app.js"></script>
</body>
</html>
